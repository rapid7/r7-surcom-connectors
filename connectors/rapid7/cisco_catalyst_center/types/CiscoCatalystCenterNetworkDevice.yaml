x-samos-type-name: CiscoCatalystCenterNetworkDevice
x-samos-namespace: cisco.catalyst.center
title: Cisco Catalyst Center Network Device
description: A managed network device from Cisco Catalyst Center

x-samos-extends-types:
  - type-name: Machine
    subtype-priority: 3

$ref: https://developer.cisco.com/docs/catalyst-center/api-reference#/components/schemas/getDeviceListResponse/properties/response/items

x-samos-keys:
  - id

required:
  - id

x-samos-table:
  - name: hostname
  - name: managementIpAddress
  - name: macAddress
  - name: family
  - name: softwareVersion
  - name: reachabilityStatus
  - name: lastUpdated

x-samos-detail:
  - name: hostname
  - name: managementIpAddress
  - name: macAddress
  - name: family
  - name: series
  - name: softwareType
  - name: softwareVersion
  - name: vendor
  - name: serialNumber
  - name: description
  - name: type
  - name: role
  - name: roleSource
  - name: reachabilityStatus
  - name: collectionStatus
  - name: managementState
  - name: deviceSupportLevel
  - name: memorySize
  - name: upTime
  - name: uptimeSeconds
  - name: bootDateTime
  - name: snmpContact
  - name: snmpLocation
  - name: interfaceCount
  - name: lineCardCount
  - name: tagCount
  - name: lastUpdated
  - name: lastUpdateTime

x-samos-derived-properties:
  d_qualified_hostname:
    type: string
    syntax: jmespath
    value: 'hostname && contains(hostname, `.`) && hostname || null'
    x-samos-hidden: true
    x-samos-correlation:
      correlation-key: Machine.qualified-hostname
      correlation-type: Machine
      priority: 3

  d_unqualified_hostname:
    type: string
    syntax: jmespath
    value: 'hostname && !contains(hostname, `.`) && hostname || null'
    x-samos-hidden: true
    x-samos-correlation:
      correlation-key: Machine.unqualified-hostname
      correlation-type: Machine
      priority: 3

properties:
  id:
    title: ID
    type: string
    x-samos-immutable: true
    x-samos-fulfills:
      type-name: core.component
      property-name: id

  hostname:
    title: Hostname
    type: string
    x-samos-fulfills:
      type-name: Machine
      property-name: hostnames

  managementIpAddress:
    title: IP Address
    type: string
    format: ip-addr
    x-samos-fulfills:
      type-name: Machine
      property-name: ips

  macAddress:
    title: MAC Address
    type: string
    format: mac-addr
    x-samos-fulfills:
      type-name: Machine
      property-name: mac_addresses
    x-samos-correlation:
      correlation-key: MacAddr.value
      correlation-type: Machine
      priority: 4

  family:
    title: Family
    type: string

  series:
    title: Series
    type: string
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: model

  platformId:
    title: Platform ID
    type: string
    x-samos-hidden: true

  softwareType:
    title: Software Type
    type: string
    x-samos-fulfills:
      type-name: Machine
      property-name: operating_system

  softwareVersion:
    title: Software Version
    type: string
    x-samos-fulfills:
      type-name: Machine
      property-name: os_version

  # vendor is not in the OpenAPI schema — added by the connector from sample data
  vendor:
    title: Vendor
    type: string
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: make

  serialNumber:
    title: Serial Number
    type: string
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: serial_number
    x-samos-correlation:
      correlation-key: core.managed.asset.serial_number
      correlation-type: Machine
      priority: 3

  description:
    title: Description
    type: string
    x-samos-fulfills:
      type-name: core.named-object
      property-name: description

  type:
    title: Device Type
    type: string
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: asset_type

  role:
    title: Role
    type: string

  roleSource:
    title: Role Source
    type: string

  reachabilityStatus:
    title: Reachability Status
    type: string

  reachabilityFailureReason:
    title: Reachability Failure Reason
    type: string

  collectionStatus:
    title: Collection Status
    type: string

  collectionInterval:
    title: Collection Interval
    type: string

  managementState:
    title: Management State
    type: string

  deviceSupportLevel:
    title: Device Support Level
    type: string

  memorySize:
    title: Memory Size
    type: string

  upTime:
    title: Up Time
    type: string

  uptimeSeconds:
    title: Uptime (Seconds)
    type: integer

  bootDateTime:
    title: Boot Date Time
    type: string
    format: date-time

  lastUpdated:
    title: Last Updated
    type: string
    format: date-time
    x-samos-fulfills:
      type-name: core.component
      property-name: last_seen

  lastUpdateTime:
    title: Last Update Time
    type: integer
    format: epoch-millis

  lastDeviceResyncStartTime:
    title: Last Device Resync Start Time
    type: string

  lastManagedResyncReasons:
    title: Last Managed Resync Reasons
    type: string

  reasonsForDeviceResync:
    title: Reasons For Device Resync
    type: string

  reasonsForPendingSyncRequests:
    title: Reasons For Pending Sync Requests
    type: string

  pendingSyncRequestsCount:
    title: Pending Sync Requests Count
    type: string

  inventoryStatusDetail:
    x-samos-hidden: true
    title: Inventory Status Detail
    type: string

  syncRequestedByApp:
    title: Sync Requested By App
    type: string

  dnsResolvedManagementAddress:
    title: DNS Resolved Management Address
    type: string

  snmpContact:
    title: SNMP Contact
    type: string

  snmpLocation:
    title: SNMP Location
    type: string

  interfaceCount:
    title: Interface Count
    type: string

  lineCardCount:
    title: Line Card Count
    type: string

  lineCardId:
    x-samos-hidden: true
    title: Line Card ID
    type: string

  tagCount:
    title: Tag Count
    type: string

  tunnelUdpPort:
    title: Tunnel UDP Port
    type: string
    nullable: true

  apManagerInterfaceIp:
    title: AP Manager Interface IP
    type: string

  apEthernetMacAddress:
    title: AP Ethernet MAC Address
    type: string
    nullable: true

  associatedWlcIp:
    title: Associated WLC IP
    type: string

  managedAtleastOnce:
    title: Managed At Least Once?
    type: boolean

  errorCode:
    title: Error Code
    type: string
    nullable: true

  errorDescription:
    title: Error Description
    type: string
    nullable: true

  waasDeviceMode:
    title: WAAS Device Mode
    type: string
    nullable: true

  location:
    title: Location
    type: string
    nullable: true

  locationName:
    title: Location Name
    type: string
    nullable: true

  instanceUuid:
    title: Instance UUID
    type: string
