x-samos-type-name: CiscoCatalystCenterClient
x-samos-namespace: cisco.catalyst.center
title: Cisco Catalyst Center Client
description: A wireless or wired client device from Cisco Catalyst Center

x-samos-extends-types:
  - type-name: Machine
    subtype-priority: 4

$ref: https://developer.cisco.com/docs/catalyst-center/api-reference#/components/schemas/retrievesTheListOfClientsWhileAlsoOfferingBasicFilteringAndSortingCapabilitiesResponse/properties/response/items

x-samos-keys:
  - id

required:
  - id

x-samos-table:
  - name: d_name
  - name: macAddress
  - name: type
  - name: ipv4Address
  - name: osType
  - name: connectionStatus
  - name: lastUpdatedTime

x-samos-detail:
  - name: d_name
  - name: macAddress
  - name: type
  - name: d_ips
  - name: siteId
  - name: connectedNetworkDevice.connectedNetworkDeviceId
  - name: vendor
  - name: osType
  - name: osVersion
  - name: formFactor
  - name: username
  - name: siteHierarchy
  - name: connectionStatus
  - name: tracked
  - name: isPrivateMacAddress
  - name: latency
  - name: lastUpdatedTime

x-samos-derived-properties:
  d_name:
    type: string
    syntax: jmespath
    value: 'name || macAddress'
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name

  d_ips:
    # Combine ipv4Address and ipv6Addresses into unified ips array
    title: IP Addresses
    type: array
    syntax: jmespath
    value: '[ipv4Address, ipv6Addresses[]][]'
    items:
      type: string
      format: ip-addr
    x-samos-fulfills:
      type-name: Machine
      property-name: ips

  d_qualified_hostname:
    type: string
    syntax: jmespath
    value: 'name && contains(name, `.`) && name || null'
    x-samos-hidden: true
    x-samos-correlation:
      correlation-key: Machine.qualified-hostname
      correlation-type: Machine
      priority: 4

  d_unqualified_hostname:
    type: string
    syntax: jmespath
    value: 'name && !contains(name, `.`) && name || null'
    x-samos-hidden: true
    x-samos-correlation:
      correlation-key: Machine.unqualified-hostname
      correlation-type: Machine
      priority: 4

properties:
  id:
    title: ID
    type: string
    x-samos-immutable: true
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.component
      property-name: id

  macAddress:
    title: MAC Address
    type: string
    format: mac-addr
    x-samos-fulfills:
      type-name: Machine
      property-name: mac_addresses
    x-samos-correlation:
      correlation-key: MacAddr.value
      correlation-type: Machine
      priority: 4

  type:
    title: Connection Type
    type: string

  name:
    title: Name
    type: string
    x-samos-fulfills:
      type-name: Machine
      property-name: hostnames

  userId:
    title: User ID
    type: string
    x-samos-hidden: true
    nullable: true

  username:
    title: Username
    type: string

  ipv4Address:
    title: IPv4 Address
    type: string
    format: ip-addr

  ipv6Addresses:
    title: IPv6 Addresses
    type: array
    items:
      type: string
      format: ip-addr

  vendor:
    title: Vendor
    type: string
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: make

  osType:
    title: OS Type
    type: string
    x-samos-fulfills:
      type-name: Machine
      property-name: operating_system

  osVersion:
    title: OS Version
    type: string
    x-samos-fulfills:
      type-name: Machine
      property-name: os_version

  formFactor:
    title: Form Factor
    type: string
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: model

  siteHierarchy:
    title: Site Hierarchy
    type: string

  siteHierarchyId:
    title: Site Hierarchy ID
    type: string
    x-samos-hidden: true

  siteId:
    title: Site
    type: string
    x-samos-ref-types:
      - type-name: CiscoCatalystCenterSite
        key-name: id

  lastUpdatedTime:
    title: Last Updated Time
    type: integer
    format: epoch-millis
    x-samos-fulfills:
      type-name: core.managed.endpoint
      property-name: endpoint_last_seen

  connectionStatus:
    title: Connection Status
    type: string

  tracked:
    title: Tracked
    type: string

  isPrivateMacAddress:
    title: Private MAC Address
    type: boolean

  health:
    title: Health
    type: object
    x-samos-hidden: true
    properties:
      overallScore:
        title: Overall Score
        type: integer
      onboardingScore:
        title: Onboarding Score
        type: integer
      connectedScore:
        title: Connected Score
        type: integer
      linkErrorPercentageThreshold:
        title: Link Error Percentage Threshold
        type: integer
      isLinkErrorIncluded:
        title: Link Error Included
        type: boolean
      rssiThreshold:
        title: RSSI Threshold
        type: integer
      snrThreshold:
        title: SNR Threshold
        type: integer
      isRssiIncluded:
        title: RSSI Included
        type: boolean
      isSnrIncluded:
        title: SNR Included
        type: boolean

  traffic:
    title: Traffic
    type: object
    properties:
      txBytes:
        title: TX Bytes
        type: integer
      rxBytes:
        title: RX Bytes
        type: integer
      usage:
        title: Usage
        type: integer
      rxPackets:
        title: RX Packets
        type: integer
      txPackets:
        title: TX Packets
        type: integer
      rxRate:
        title: RX Rate
        type: number
      txRate:
        title: TX Rate
        type: integer
      rxLinkErrorPercentage:
        title: RX Link Error Percentage
        type: number
      txLinkErrorPercentage:
        title: TX Link Error Percentage
        type: number
      rxRetries:
        title: RX Retries
        type: integer
      rxRetryPercentage:
        title: RX Retry Percentage
        type: number
      txDrops:
        title: TX Drops
        type: integer
      txDropPercentage:
        title: TX Drop Percentage
        type: integer
      dnsRequestCount:
        title: DNS Request Count
        type: integer
      dnsResponseCount:
        title: DNS Response Count
        type: integer

  connectedNetworkDevice:
    title: Connected Network Device
    type: object
    properties:
      connectedNetworkDeviceId:
        title: connectedNetworkDevice
        type: string
        x-samos-ref-types:
          - type-name: CiscoCatalystCenterNetworkDevice
            key-name: id
      connectedNetworkDeviceName:
        title: Device Name
        type: string
      connectedNetworkDeviceManagementIp:
        title: Device Management IP
        type: string
        format: ip-addr
      connectedNetworkDeviceMac:
        title: Device MAC
        type: string
        format: mac-addr
      connectedNetworkDeviceType:
        title: Device Type
        type: string
      interfaceName:
        title: Interface Name
        type: string
      interfaceSpeed:
        title: Interface Speed
        type: integer
      duplexMode:
        title: Duplex Mode
        type: string

  connection:
