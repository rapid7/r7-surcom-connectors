  LastUpdated:
    title: Last Updated
    type: string
    format: date-time
    x-samos-fulfills:
      type-name: core.component
      property-name: last_seen

  IssuesCleanupInProgress:
    title: Issues Cleanup In Progress?
    type: boolean

  HasExceedingIssuesNumber:
    title: Has Exceeding Issues Number?
    type: boolean

  HasExceedingScansNumber:
    title: Has Exceeding Scans Number?
    type: boolean

