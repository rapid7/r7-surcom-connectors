x-samos-derived-properties:
  # Calculated value: only human user types take part in email correlation.
  # Automated/integration users (e.g. AutomatedProcess, CloudIntegrationUser)
  # share noreply@ addresses and would otherwise be merged into one User.
  d_email:
    x-samos-hidden: true
    title: Email
    type: string
    syntax: jmespath
    value: "contains(['Standard', 'PowerPartner', 'CspLitePortal', 'CustomerSuccess', 'PowerCustomerSuccess', 'CsnOnly'], UserType) && Email || `null`"
    x-samos-fulfills:
      type-name: User
      property-name: email
    x-samos-correlation:
      correlation-key: User.email
      correlation-type: User
      priority: 3

  # Salesforce automation/integration user types are
  # service accounts rather than people.
  d_is_service_account:
    title: Service Account?
    type: boolean
    syntax: jmespath
    value: "contains(['AutomatedProcess', 'CloudIntegrationUser'], UserType)"
    x-samos-fulfills:
      type-name: core.principal
      property-name: is_service_account

  # portal, community, and public-site guest users are
  # people outside the org who have a Salesforce login.
  d_is_external:
    title: External?
    type: boolean
    syntax: jmespath
    value: "contains(['PowerPartner', 'PowerCustomerSuccess', 'CustomerSuccess', 'CspLitePortal', 'Guest'], UserType)"
    x-samos-fulfills:
      type-name: core.principal
      property-name: is_external

