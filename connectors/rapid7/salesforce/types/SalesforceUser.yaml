x-samos-type-name: SalesforceUser
x-samos-namespace: salesforce
title: Salesforce User
description: >-
  A licensed User in a Salesforce org (has login access). Users are correlated
  to other sources by email. Salesforce does not enforce unique email
  addresses, so Users that share an address (for example, shared or
  integration mailboxes) can be grouped into a single User.
x-samos-detail-prefer-type-title: true
x-samos-extends-types:
  - type-name: User
    subtype-priority: 3

x-samos-keys:
  - Id

required:
  - Id

x-samos-table:
