x-samos-type-name: SalesforceContact
x-samos-namespace: salesforce
title: Salesforce Contact
description: >-
  A person associated with an Account in Salesforce (e.g. a customer contact).
  Unlike SalesforceUser, a Contact does not have Salesforce login access.
  Contacts are correlated to other sources by email. Salesforce does not
  enforce unique email addresses, so Contacts that share an address can be
  grouped into a single User.
x-samos-detail-prefer-type-title: true
x-samos-extends-types:
  # Contacts are CRM records about external people, so they rank below
  # SalesforceUser and identity providers.
  - type-name: User
    subtype-priority: 1

x-samos-keys:
  - Id

required:
  - Id

x-samos-table:
  - name: Name
  - name: Email
  - name: Title
  - name: Department
  - name: AccountId
  - name: Phone
  - name: MobilePhone

x-samos-detail:
  - name: Name
  - name: Salutation
  - name: FirstName
  - name: MiddleName
  - name: LastName
  - name: Suffix
  - name: Email
  - name: IsEmailBounced
  - name: EmailBouncedReason
  - name: EmailBouncedDate
  - name: Title
  - name: TitleType
  - name: Department
  - name: DepartmentGroup
  - name: AccountId
  - name: Phone
  - name: MobilePhone
  - name: HomePhone
  - name: OtherPhone
  - name: AssistantPhone
  - name: Fax
  - name: ReportsToId
  - name: MailingStreet
