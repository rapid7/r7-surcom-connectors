x-samos-type-name: VeeamDataPlatformJob
x-samos-namespace: veeam.data.platform
title: Veeam Backup Job Configuration
description: A backup job configuration in Veeam Backup & Replication defining backup policies, schedules, storage, and guest processing settings.
x-samos-detail-prefer-type-title: true
x-samos-extends-types:
  - type-name: core.component
    subtype-priority: 3

x-samos-keys:
  - id

x-samos-table:
  - name: name
  - name: type
  - name: description
  - name: isDisabled
  - name: isHighPriority

x-samos-detail:
  - name: name
  - name: type
  - name: description
  - name: isDisabled
  - name: isHighPriority
  - name: storage
  - name: schedule
  - name: guestProcessing
  - name: virtualMachines

x-samos-derived-properties:
  d_active:
    title: Active
    type: boolean
    syntax: jmespath
    value: 'isDisabled == `false`'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.component
      property-name: active

