            - type-name: NcentralCustomer
              key-name: customerid
      customername:
        type: array
        items:
          type: string
      soname:
        type: array
        items:
          type: string
      uri:
        type: array
        items:
          type: string
      remotecontroluri:
        type: array
        items:
          type: string
      sourceuri:
        type: array
        items:
          type: string
      dynamicuri:
        type: array
        items:
          type: string
      description:
        type: array
        items:
          type: string
      osid:
        type: array
        items:
          type: string
      supportedos:
        type: array
        items:
          type: string
      longname:
        type: array
        items:
          type: string
      deviceclass:
        type: array
        items:
          type: string
      licensemode:
        type: array
        items:
          type: string
      createdon:
        type: array
        items:
          type: string
      isdisconnectable:
        type: array
        items:
          type: string
      ismanagedasset:
        type: array
        items:
          type: string
      isdiscoveredasset:
        type: array
        items:
          type: string
      snmpenabled:
        type: array
        items:
          type: string
      veritasenabled:
        type: array
        items:
          type: string
      edfenabled:
        type: array
        items:
          type: string
      remotemanagementenabled:
        type: array
        items:
          type: string
      remotemanagementpreferredapplianceid:
        type: array
        items:
          type: string
      remotemanagementinstalled:
        type: array
        items:
          type: string
      remotemanagementversion:
        type: array
        items:
          type: string
      warrantyexpirydate:
        type: array
        items:
          type: string
      leaseexpirydate:
        type: array
        items:
          type: string
      purchaseDate:
        type: array
        items:
          type: string
      cost:
        type: array
        items:
          type: string
      location:
        type: array
        items:
          type: string
      assettag:
        type: array
        items:
          type: string
      expectedreplacementdate:
        type: array
