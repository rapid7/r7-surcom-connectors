      macs:
        type: array
        items:
          type: string
      discovereduris:
        type: array
        items:
          type: string
      remotemanagementinstalldate:
        type: array
        items:
          type: string
      deviceclasslabel:
        type: array
        items:
          type: string
      supportedoslabel:
        type: array
        items:
          type: string
      defaultaddresstype:
        type: array
        items:
          type: string
      discoveredfqdns:
        type: array
