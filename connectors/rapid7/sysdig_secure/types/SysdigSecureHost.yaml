x-samos-type-name: SysdigSecureHost
x-samos-namespace: sysdig.secure
title: Sysdig Secure Host
description: A Host represents a physical or virtual machine running software
  workloads, monitored by Sysdig Secure.
x-samos-detail-prefer-type-title: true
# Schema entity: Host. All fields confirmed from refdocs/sysdig_schema.yaml (*).
x-samos-extends-types:
  - type-name: Machine
    subtype-priority: 3

x-samos-keys:
  - name

x-samos-table:
  - name: name
  - name: type
  - name: platform
  - name: operatingSystem
  - name: isExposed
  - name: lastModified
  - name: lastSeen

x-samos-detail:
  - name: name
  - name: hostname
  - name: type
  - name: platform
  - name: operatingSystem
  - name: isExposed
  - name: architecture
  - name: kernelVersion
  - name: accountId
  - name: subscriptionId
  - name: location
  - name: lastModified
  - name: lastSeen

x-samos-derived-properties:
  d_qualified_hostname:
    x-samos-hidden: true
    type: string
    syntax: jmespath
    value: 'hostname && contains(hostname, `.`) && hostname || null'
    x-samos-correlation:
      correlation-key: Machine.qualified-hostname
      correlation-type: Machine
      priority: 2

  d_unqualified_hostname:
    x-samos-hidden: true
    type: string
    syntax: jmespath
    value: 'hostname && !contains(hostname, `.`) && hostname || null'
    x-samos-correlation:
      correlation-key: Machine.unqualified-hostname
      correlation-type: Machine
      priority: 2

  d_name:
    # name is immutable in below but,
    # we want to fulfill core.named-object:name which is not immutable,
    # so we derive a property to fulfill it.
    type: string
    x-samos-hidden: true
    syntax: jmespath
    value: 'name'
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name

  d_cloud:
    # All hosts in Sysdig Secure are cloud assets,
    # so we derive this property with a constant value of true to fulfill Machine:cloud.
    x-samos-hidden: true
    type: boolean
    syntax: jmespath
    value: 'true'
    x-samos-fulfills:
      type-name: core.component
      property-name: cloud

properties:
  name:
    type: string
    title: Name
    x-samos-immutable: true
    x-samos-fulfills:
      type-name: core.component
      property-name: id
    x-samos-correlation:
      correlation-key: CloudInstanceId
      correlation-type: Machine
      priority: 4

  hostname:
    type: string
    title: Hostname (FQDN)
    x-samos-fulfills:
      type-name: Machine
      property-name: hostnames

  type:
    type: string
    title: Host Type
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: asset_type

  platform:
    type: string
    title: Cloud Platform
    x-samos-ref-types:
      - type-name: SysdigSecureCloudProvider
        key-name: id
    x-samos-fulfills:
      type-name: core.cloud-component
      property-name: provider

  operatingSystem:
    type: string
    title: Operating System
    x-samos-fulfills:
      type-name: Machine
      property-name: operating_system

  architecture:
    type: string
    title: Architecture
    x-samos-fulfills:
      type-name: Machine
      property-name: os_architecture

  kernelVersion:
    type: string
    title: Kernel Version
    x-samos-fulfills:
      type-name: Machine
      property-name: os_version

  accountId:
    type: string
    title: Cloud Account
    x-samos-ref-types:
      - type-name: SysdigSecureAwsAccount
        key-name: id
    x-samos-fulfills:
      type-name: core.cloud-component
      property-name: cloud_account

  subscriptionId:
    type: string
    title: Subscription ID

  location:
    type: string
    title: Location

  isExposed:
    type: boolean
    title: Exposed?

  lastSeen:
    type: string
    title: Last Seen
    format: date-time
    x-samos-fulfills:
      type-name: core.component
      property-name: last_seen

  lastModified:
    type: string
    title: Last Modified
    format: date-time

x-samos-virtual:
  exposures:
    type-name: Exposure
    cypher-pattern: >
      <-[:`e:Finding:applies_to`]-(:SysdigSecureFinding)-[:`e:Finding:vulnerability`]->(e:SysdigSecureVulnerability)
