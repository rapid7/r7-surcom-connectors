x-samos-type-name: SonicWallCaptureClientDevice
x-samos-namespace: sonicwall.capture.client
title: SonicWall Capture Client Device
description: An endpoint device managed by SonicWall Capture Client, representing a physical or virtual machine with security agent installed.

x-samos-extends-types:
  - type-name: Machine
    subtype-priority: 3

x-samos-keys:
  - deviceId

x-samos-table:
  - name: name
  - name: deviceType
  - name: os
  - name: osVersion
  - name: ip
  - name: onlineStatus
  - name: clientVersion
  - name: clientState
  - name: updatedAt

x-samos-detail:
  - name: name
  - name: deviceType
  - name: d_users
  - name: serverType
  - name: onlineStatus
  - name: networkStatus
  - name: os
  - name: osVersion
  - name: hwModel
  - name: processorType
  - name: x_all_ips
  - name: x_mac_addresses
  - name: s1Agent
  - name: clientVersion
  - name: clientState
  - name: currentUser
  - name: firewallProtectionMode
  - name: d_endpoint_protection_active
  - name: scanStatus
  - name: serialNumber
  - name: createdAt
  - name: updatedAt

x-samos-derived-properties:
  # Commissioned state indicates active endpoint protection
  d_endpoint_protection_active:
    title: Endpoint Protection Active?
    type: boolean
    x-samos-fulfills:
      type-name: core.managed.endpoint
      property-name: endpoint_protection_active
    syntax: expression
    value: 'clientState == `commissioned`'

  # Extracts FQDN from device name for machine correlation
  d_qualified_hostname:
    x-samos-hidden: true
    type: string
    syntax: jmespath
    value: "name && contains(name, '.') && name || null"
    x-samos-correlation:
      correlation-key: Machine.qualified-hostname
      correlation-type: Machine
      priority: 2

  # Extracts short hostname from device name for machine correlation
  d_unqualified_hostname:
    x-samos-hidden: true
    type: string
    syntax: jmespath
    value: "name && !contains(name, '.') && name || null"
    x-samos-correlation:
      correlation-key: Machine.unqualified-hostname
      correlation-type: Machine
      priority: 2

  # Provides hostname array for unified Machine type fulfillment
  d_hostnames:
    x-samos-hidden: true
    type: array
    items:
      type: string
    syntax: jmespath
    value: '[name]|[?@]'
    x-samos-fulfills:
      type-name: Machine
      property-name: hostnames

  # Maps MITRE mitigations based on scan capability and firewall protection mode
  d_mitigations:
    title: Mitigations
    x-samos-hidden: true
    type: array
    items:
      type: string
      x-samos-ref-types:
        - type-name: Mitigation
          key-name: id
    syntax: jmespath
    # M1049 - Antivirus/Antimalware (applied when device has scan capability enabled)
    # M1040 - Behavior Prevention on Endpoint (applied when firewall protection mode is active)
    value: >-
      [
        (clientState == `commissioned` && scanStatus != null && scanStatus != ``) && `M1049` || null,
        (clientState == `commissioned` && firewallProtectionMode != null && firewallProtectionMode != ``) && `M1040` || null
      ] | [?@]
    x-samos-fulfills:
      type-name: core.component
      property-name: mitigations

  # Extracts associated user IDs for the owned-entity relationship
  d_users:
    title: Endpoint Users
    type: array
    items:
      type: string
      x-samos-ref-types:
        - type-name: SonicWallCaptureClientEndpointUser
          key-name: userId
    syntax: jmespath
    value: 'users[].userId | [?@]'
    x-samos-fulfills:
      type-name: core.owned-entity
      property-name: users

