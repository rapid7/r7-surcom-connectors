x-samos-derived-properties:
  # Active when agent is running and not decommissioned
  d_endpoint_protection_active:
    title: Endpoint Protection Active?
    type: boolean
    x-samos-fulfills:
      type-name: core.managed.endpoint
      property-name: endpoint_protection_active
    syntax: expression
    value: 'isActive == `true` && isDecommissioned != `true`'

  # Maps MITRE mitigations based on active scanning and threat prevention capabilities
  d_mitigations:
    title: Mitigations
    x-samos-hidden: true
    type: array
    items:
      type: string
      x-samos-ref-types:
        - type-name: Mitigation
          key-name: id
    syntax: jmespath
    # M1049 - Antivirus/Antimalware (applied when agent has successful scan dates, indicating active threat scanning)
    # M1040 - Behavior Prevention on Endpoint (applied when agent is active with mitigation mode enabled for threat prevention)
    value: >-
      [
        (isActive == `true` && isDecommissioned != `true` && lastSuccessfulScanDate != null) && `M1049` || null,
        (isActive == `true` && isDecommissioned != `true` && mitigationMode != null && mitigationMode != ``) && `M1040` || null
      ] | [?@]
    x-samos-fulfills:
      type-name: core.component
      property-name: mitigations

  # Extracts FQDN from computerName for machine correlation
  d_qualified_hostname:
    x-samos-hidden: true
    type: string
    syntax: jmespath
    value: "computerName && contains(computerName, '.') && computerName || null"
    x-samos-correlation:
      correlation-key: Machine.qualified-hostname
      correlation-type: Machine
      priority: 3

  # Extracts short hostname from computerName for machine correlation
  d_unqualified_hostname:
    x-samos-hidden: true
    type: string
    syntax: jmespath
    value: "computerName && !contains(computerName, '.') && computerName || null"
    x-samos-correlation:
      correlation-key: Machine.unqualified-hostname
      correlation-type: Machine
      priority: 3

  # Provides hostname array for unified Machine type fulfillment
  d_hostnames:
    x-samos-hidden: true
    type: array
    items:
      type: string
    syntax: jmespath
    value: '[computerName]|[?@]'
    x-samos-fulfills:
      type-name: Machine
      property-name: hostnames

