x-samos-type-name: AvigilonAltaACU
x-samos-namespace: avigilon.alta
title: Avigilon Alta Access Control Unit
description: An Access Control Unit (ACU) - the physical controller device installed at a site that manages readers and entries.
x-samos-detail-prefer-type-title: true

x-samos-extends-types:
  - type-name: Machine
    subtype-priority: 3

x-samos-keys:
  - d_acu_id
  - id

required:
  - id
x-samos-table:
  - name: name
  - name: acuModel.name
  - name: serialNumber
  - name: softwareVersionNumber
  - name: status
  - name: org.name
  - name: iotCertOpal
  - name: awsIotCertArn
  - name: createdAt
  - name: updatedAt

x-samos-detail:
  - name: name
  - name: opal
  - name: hostname
  - name: thingName
  - name: serialNumber
  - name: serialNumberBrief
  - name: softwareVersionNumber
  - name: acuModel
  - name: org
  - name: ownedByOrg
  - name: status
  - name: statusAt
  - name: statusMessage
  - name: isVirtual
  - name: isGatewayMode
  - name: entryCount
  - name: notes
  - name: enterpriseVpnConfig
  - name: acuShadowState
  - name: createdAt
  - name: updatedAt

x-samos-derived-properties:
  d_acu_id:
    # API returns integer id; Machine.id is string in the unified model.
    title: ACU ID
    type: string
    syntax: jmespath
    value: id
    x-samos-hidden: true
    x-samos-immutable: true
    x-samos-fulfills:
      type-name: core.component
      property-name: id

  d_qualified_hostname:
    type: string
    value: hostname && contains(hostname, `.`) && hostname || null
    syntax: jmespath
    x-samos-hidden: true
    x-samos-correlation:
      correlation-key: Machine.qualified-hostname
      correlation-type: Machine
      priority: 2

  d_unqualified_hostname:
    type: string
    value: hostname && !contains(hostname, `.`) && hostname || null
    syntax: jmespath
    x-samos-hidden: true
    x-samos-correlation:
      correlation-key: Machine.unqualified-hostname
      correlation-type: Machine
      priority: 2

  d_hostnames:
    title: Hostnames
    type: array
    syntax: jmespath
    value: '[hostname][?@]'
    items:
      type: string
    x-samos-fulfills:
      type-name: Machine
      property-name: hostnames

  d_mitigations:
    # M1051 (Update Software), i.e. patch management, if mdm.mdm_enabled
    x-samos-hidden: true
    type: array
    syntax: jmespath
    value: >-
      [
        status == 'online' && `M1051` || null,
      ][?@]
    items:
      type: string
      x-samos-ref-types:
        - type-name: Mitigation
          key-name: id
    x-samos-fulfills:
      type-name: core.component
      property-name: mitigations

  d_active:
    # Online status from `status` ('online' / 'offline').
    title: Active?
    type: boolean
    syntax: jmespath
    value: 'status == `online`'
    x-samos-fulfills:
      type-name: core.component
      property-name: active

properties:
