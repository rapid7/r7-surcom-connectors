x-samos-table:
  - name: name
  - name: description
  - name: userCount
  - name: d_sites

x-samos-detail:
  - name: name
  - name: description
  - name: userCount
  - name: d_sites
  - name: badgeConfig
  - name: createdAt
  - name: updatedAt

x-samos-derived-properties:
  d_group_id:
    # API returns integer id; unified UserGroup.id is string.
    title: Group ID
    type: string
    syntax: jmespath
    value: id
    x-samos-hidden: true
    x-samos-immutable: true
    x-samos-fulfills:
      type-name: UserGroup
      property-name: id

  d_sites:
    title: Sites
