x-samos-type-name: AvigilonAltaGroup
x-samos-namespace: avigilon.alta
title: Avigilon Alta Access Group
description: An access group from Avigilon Alta (Openpath) Access. Defines which users can access which sites.
x-samos-detail-prefer-type-title: true
x-samos-extends-types:
