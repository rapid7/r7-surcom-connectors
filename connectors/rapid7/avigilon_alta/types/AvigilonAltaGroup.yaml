    type: string
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name
    x-samos-correlation:
      correlation-key: UserGroup.name
      correlation-type: UserGroup
      priority: 3
  description:
    title: Description
    type: string
    x-samos-fulfills:
      type-name: core.named-object
      property-name: description
  userCount:
    title: User Count
    type: integer
  badgeConfig:
    title: Badge Config
    type: object
    properties:
      id:
        title: ID
        type: integer
      nameConfig:
        title: Name Config
        type: object
  sites:
    title: Sites
    type: array
