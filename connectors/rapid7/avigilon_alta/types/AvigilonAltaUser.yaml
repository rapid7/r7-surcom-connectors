  - name: statusLastUpdatedAt
  - name: roles
  - name: createdAt
  - name: updatedAt
  - name: startDate
  - name: endDate

x-samos-derived-properties:
  d_user_id:
    # API returns integer id; unified User.id is string.
    title: User ID
    type: string
    syntax: jmespath
    value: id
    x-samos-hidden: true
    x-samos-immutable: true
    x-samos-fulfills:
      type-name: User
      property-name: id

  d_active:
    # Derived from `status` field. 'A' (Active) indicates an active user.
    title: Active?
    type: boolean
    syntax: jmespath
    value: 'status == `A`'
    x-samos-fulfills:
      type-name: core.principal
      property-name: active

  d_groups:
    title: Access Groups
    type: array
    syntax: jmespath
    value: 'groups[*].id.to_string(@)'
    items:
      type: string
      x-samos-ref-types:
        - type-name: AvigilonAltaGroup
          key-name: d_group_id
    x-samos-fulfills:
      type-name: core.principal
      property-name: groups

  d_sites:
    title: Sites
    type: array
    syntax: jmespath
    value: 'sites[*].id.to_string(@)'
    items:
      type: string
      x-samos-ref-types:
        - type-name: AvigilonAltaSite
          key-name: d_site_id

