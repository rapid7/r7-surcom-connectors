x-samos-type-name: AvigilonAltaUser
x-samos-namespace: avigilon.alta
title: Avigilon Alta User
description: A user (identity) from Avigilon Alta (Openpath) Access with assigned access groups and site permissions.
x-samos-detail-prefer-type-title: true
x-samos-extends-types:
  - type-name: User
    subtype-priority: 3

x-samos-keys:
  - d_user_id
  - id
required:
  - id
x-samos-table:
  - name: identity.fullName
  - name: identity.email
  - name: externalId
  - name: status
  - name: d_groups
  - name: d_sites
  - name: d_active
  - name: department
  - name: lastActivityAt

x-samos-detail:
  - name: identity.fullName
  - name: identity.firstName
  - name: identity.lastName
  - name: identity.email
  - name: identity.mobilePhone
  - name: opal
  - name: externalId
  - name: status
  - name: d_groups
  - name: d_sites
  - name: d_active
  - name: hasRemoteUnlock
  - name: isOverrideAllowed
  - name: title
  - name: department
  - name: personId
