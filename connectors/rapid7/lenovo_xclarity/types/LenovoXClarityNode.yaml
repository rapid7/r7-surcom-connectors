x-samos-type-name: LenovoXClarityNode
x-samos-namespace: lenovo.xclarity
title: Lenovo XClarity Node
description: A bare-metal server or compute node managed by Lenovo XClarity Administrator,
  including hardware details, firmware levels, and network configuration.
x-samos-detail-prefer-type-title: true

x-samos-extends-types:
  - type-name: Machine
    subtype-priority: 4

x-samos-keys:
  - uuid

required:
  - uuid

x-samos-table:
  - name: name
  - name: type
  - name: model
  - name: serialNumber
  - name: mgmtProcIPaddress
  - name: overallHealthState
  - name: powerStatus

x-samos-detail:
  - name: name
  - name: overallHealthState
  - name: accessState
  - name: status
  - name: powerStatus
  - name: type
  - name: subType
  - name: machineType
  - name: model
  - name: productName
  - name: serialNumber
  - name: assetTag
  - name: manufacturer
  - name: hostname
  - name: FQDN
  - name: mgmtProcIPaddress
  - name: ipv4Addresses
  - name: ipv6Addresses
  - name: x_mac_addresses
  - name: arch
  - name: osInfo
  - name: firmware
  - name: secureBootMode
  - name: securityMode
  - name: tlsVersion
  - name: nist
  - name: isRemotePresenceEnabled
  - name: lanOverUsb
  - name: location
  - name: parent
  - name: description
  - name: userDescription

x-samos-derived-properties:
  d_ips:
    type: array
    x-samos-hidden: true
    syntax: jmespath
    # Fulfills Machine.ips for the unified view; IPs correlate as IpAddress, not Machine
    value: '[ipv4Addresses || `[]`, ipv6Addresses || `[]`][]'
    items:
      type: string
      format: ip-addr
    x-samos-fulfills:
      type-name: Machine
      property-name: ips

  d_active:
    type: boolean
    x-samos-hidden: true
    syntax: jmespath
    # Node is considered active when the appliance reports it reachable
    value: "accessState == 'Online'"
    x-samos-fulfills:
      type-name: core.component
      property-name: active

  d_is_part_of:
    type: string
    x-samos-hidden: true
    syntax: jmespath
    # Blade nodes expose their parent chassis UUID under parent.uuid (empty for rack servers)
    value: 'parent.uuid || `null`'
    x-samos-ref-types:
      - key-name: uuid
        type-name: LenovoXClarityChassis
    x-samos-fulfills:
      type-name: core.component
      property-name: is_part_of_ref

  d_mitigations:
    type: array
    x-samos-hidden: true
    syntax: jmespath
    # M1046 (Boot Integrity): UEFI Secure Boot is enabled on the server
    value: "[secureBootMode.currentValue == 'Enabled' && `M1046`] | [?@]"
    items:
      type: string
      x-samos-ref-types:
        - key-name: id
          type-name: Mitigation
    x-samos-fulfills:
      type-name: core.component
      property-name: mitigations

