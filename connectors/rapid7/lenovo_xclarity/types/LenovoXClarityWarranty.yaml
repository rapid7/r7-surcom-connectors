x-samos-type-name: LenovoXClarityWarranty
x-samos-namespace: lenovo.xclarity
title: Lenovo XClarity Warranty
description: Warranty information for a device managed by Lenovo XClarity Administrator,
  including warranty dates, status, and machine identifiers.
x-samos-detail-prefer-type-title: true

x-samos-extends-types:
  - type-name: core.component
    subtype-priority: 4

x-samos-keys:
  - id

required:
  - id

x-samos-table:
  - name: deviceName
  - name: deviceType
  - name: machineType
  - name: machineModel
  - name: serialNumber
  - name: warrantyType
  - name: startDate
  - name: endDate
  - name: status

x-samos-detail:
  - name: id
  - name: deviceName
  - name: x_device_uuid
  - name: deviceType
  - name: machineType
  - name: machineModel
  - name: serialNumber
  - name: warrantyType
  - name: groupName
  - name: status
  - name: detailsURL
  - name: startDate
  - name: endDate

x-samos-derived-properties:
  d_active:
    type: boolean
    x-samos-hidden: true
    syntax: jmespath
    # Warranty is active only when coverage status is 'Active' (the API docs show both cases)
    value: "contains(['Active', 'active'], status)"
    x-samos-fulfills:
      type-name: core.component
      property-name: active

properties:
  deviceName:
    type: string
    title: Device Name
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name
  deviceType:
    type: string
    title: Device Type
  detailsURL:
    type: string
    title: Details URL
  endDate:
    type: string
    format: date-time
    title: End Date
  groupName:
    type: array
    title: Group Name
    items:
      type: string
  groupUUID:
    type: array
    title: Group UUID
    items:
      type: string
  id:
    type: string
    title: ID
    x-samos-immutable: true
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.component
      property-name: id
  machineModel:
    type: string
    title: Machine Model
  machineType:
    type: string
    title: Machine Type
  serialNumber:
    type: string
    title: Serial Number
  x_device_uuid:
    type: string
    title: Device
    description: The device covered by this warranty, matched by serial number (generated by the connector).
    x-samos-ref-types:
      - type-name: LenovoXClarityNode
        key-name: uuid
      - type-name: LenovoXClarityChassis
        key-name: uuid
      - type-name: LenovoXClaritySwitch
        key-name: uuid
      - type-name: LenovoXClarityStorage
        key-name: uuid
  startDate:
    type: string
    format: date-time
    title: Start Date
  status:
    type: string
    title: Status
  warrantyType:
    type: string
    title: Warranty Type
