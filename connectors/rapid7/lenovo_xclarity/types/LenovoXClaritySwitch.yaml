x-samos-type-name: LenovoXClaritySwitch
x-samos-namespace: lenovo.xclarity
title: Lenovo XClarity Switch
description: A managed network switch (e.g. RackSwitch or Flex System switch)
  managed by Lenovo XClarity Administrator.
x-samos-detail-prefer-type-title: true

x-samos-extends-types:
  - type-name: Machine
    subtype-priority: 4

x-samos-keys:
  - uuid

required:
  - uuid

x-samos-table:
  - name: name
  - name: type
  - name: model
  - name: serialNumber
  - name: mgmtProcIPaddress
  - name: overallHealthState
  - name: powerState

x-samos-detail:
  - name: name
  - name: overallHealthState
  - name: accessState
  - name: powerState
  - name: type
  - name: machineType
  - name: model
  - name: productName
  - name: serialNumber
  - name: manufacturer
  - name: hostname
  - name: mgmtProcIPaddress
  - name: ipv4Addresses
  - name: ipv6Addresses
  - name: macAddresses
  - name: OS
  - name: firmware
  - name: httpsEnabled
  - name: protectedMode
  - name: stackMode
  - name: stackRole
  - name: upTime
  - name: location
  - name: parent
  - name: description
  - name: userDescription

x-samos-derived-properties:
  d_ips:
    type: array
    x-samos-hidden: true
    syntax: jmespath
    # Fulfills Machine.ips for the unified view; IPs correlate as IpAddress, not Machine
    value: '[ipv4Addresses || `[]`, ipv6Addresses || `[]`][]'
    items:
      type: string
      format: ip-addr
    x-samos-fulfills:
      type-name: Machine
      property-name: ips

  d_active:
    type: boolean
    x-samos-hidden: true
    syntax: jmespath
    # Switch is considered active when the appliance reports it reachable
    value: "accessState == 'Online'"
    x-samos-fulfills:
      type-name: core.component
      property-name: active

  d_is_part_of:
    type: string
    x-samos-hidden: true
    syntax: jmespath
    # Switches expose their parent chassis UUID under parent.uuid (empty for standalone rack switches)
    value: 'parent.uuid || `null`'
    x-samos-ref-types:
      - key-name: uuid
        type-name: LenovoXClarityChassis
    x-samos-fulfills:
      type-name: core.component
      property-name: is_part_of_ref

properties:
  uuid:
    type: string
    title: UUID
    x-samos-immutable: true
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.component
      property-name: id
  name:
    type: string
    title: Name
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name
  overallHealthState:
    type: string
    title: Overall Health State
    x-samos-ref-types:
      - key-name: id
        type-name: LenovoXClarityEnumOperationalStatus
    x-samos-fulfills:
      type-name: core.component
      property-name: operational_status
  accessState:
    type: string
    title: Access State
  applyPending:
    type: string
    title: Apply Pending
  backedBy:
    type: string
    title: Backed By
  badCredentials:
    type: boolean
    title: Bad Credentials?
  cmmDisplayName:
    type: string
    title: CMM Display Name
  cmmHealthState:
    type: string
    title: CMM Health State
  contact:
    type: string
    title: Contact
  cpuUtilization:
    type: string
    title: CPU Utilization
  dataHandle:
    type: integer
    title: Data Handle
    format: epoch-millis
  description:
    type: string
    title: Description
    x-samos-fulfills:
      type-name: core.named-object
      property-name: description
  dnsHostnames:
    type: array
    title: DNS Hostnames
    items:
      type: string
  domainName:
    type: string
    title: Domain Name
  elapsedTimeMillisecs:
    type: string
    title: Elapsed Time Millisecs
  entitleSerialNumber:
    type: string
    title: Entitle Serial Number
  errorFields:
    type: array
    title: Error Fields
    items:
      type: string
  excludedHealthState:
    type: string
    title: Excluded Health State
  expiredCredentials:
    type: boolean
    title: Expired Credentials?
  firmware:
    type: array
    title: Firmware
    items:
      type: object
      properties:
        build:
          type: string
          title: Build
        classifications:
          type: array
          title: Classifications
          items:
            type: string
        date:
          type: string
          title: Date
        name:
          type: string
          title: Name
        role:
          type: string
          title: Role
        status:
          type: string
          title: Status
        type:
          type: string
          title: Type
        version:
          type: string
          title: Version
  FRU:
    type: string
    title: FRU
  fruSerialNumber:
    type: string
    title: FRU Serial Number
  globalVlagState:
    type: string
    title: Global VLAG State
  height:
    type: integer
    title: Height
  hostname:
    type: string
    title: Hostname
    x-samos-fulfills:
      type-name: Machine
      property-name: hostnames
  httpsEnabled:
    type: boolean
    title: HTTPS Enabled?
  ipInterfaces:
    type: array
    title: IP Interfaces
    items:
      type: object
      properties:
        IPv4assignments:
          type: array
          title: I Pv Assignments
          items:
            type: object
            properties:
              id:
                type: integer
                title: ID
              subnet:
                type: string
                title: Subnet
                format: ip-addr
              gateway:
                type: string
                title: Gateway
                format: ip-addr
              address:
                type: string
                title: Address
                format: ip-addr
              type:
                type: string
                title: Type
        IPv4DHCPmode:
          type: string
          title: I Pv Dhc Pmode
        IPv4enabled:
          type: boolean
          title: I Pv Enabled?
        IPv6assignments:
          type: array
          title: I Pv Assignments
          items:
            type: object
            properties:
              id:
                type: integer
                title: ID
              scope:
                type: string
                title: Scope
              gateway:
                type: string
                title: Gateway
              source:
                type: string
                title: Source
              address:
                type: string
                title: Address
              prefix:
                type: integer
                title: Prefix
              type:
                type: string
                title: Type
        IPv6DHCPenabled:
          type: boolean
          title: I Pv Dhc Penabled?
        IPv6enabled:
          type: boolean
          title: I Pv Enabled?
        IPv6statelessEnabled:
          type: boolean
          title: I Pv Stateless Enabled?
        IPv6staticEnabled:
          type: boolean
          title: I Pv Static Enabled?
        label:
          type: string
          title: Label
        name:
          type: string
          title: Name
  ipv4Addresses:
    type: array
    title: IPv4 Addresses
    items:
      type: string
  ipv6Addresses:
    type: array
    title: IPv6 Addresses
    items:
      type: string
  isConnectionTrusted:
    type: string
    title: Connection Trusted
  leds:
    type: array
    title: LEDs
    items:
      type: string
  location:
    type: object
    title: Location
    properties:
      location:
        type: string
        title: Location
      lowestRackUnit:
        type: integer
        title: Lowest Rack Unit
      rack:
        type: string
        title: Rack
      room:
        type: string
        title: Room
  macAddresses:
    type: array
    title: MAC Addresses
    items:
      type: string
      format: mac-addr
    x-samos-fulfills:
      type-name: Machine
      property-name: mac_addresses
    x-samos-correlation:
      correlation-key: MacAddr.value
      correlation-type: Machine
      priority: 3
  machineType:
    type: string
    title: Machine Type
  manufacturer:
    type: string
    title: Manufacturer
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: make
  manufacturerId:
    type: string
    title: Manufacturer ID
  manufacturingDate:
    type: string
    title: Manufacturing Date
  memoryUtilization:
    type: string
    title: Memory Utilization
  mgmtProcIPaddress:
    type: string
    title: Management IP Address
    format: ip-addr
  model:
    type: string
    title: Model
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: model
  ntpPushEnabled:
    type: boolean
    title: NTP Push Enabled?
  ntpPushFrequency:
    type: integer
    title: NTP Push Frequency
  operationalVlagState:
    type: string
    title: Operational VLAG State
  OS:
    type: string
    title: OS
    x-samos-fulfills:
      type-name: Machine
      property-name: operating_system
  panicDump:
    type: string
    title: Panic Dump
  parent:
    type: object
    title: Parent
    description: Parent chassis enclosure, if this switch is chassis-mounted.
    properties:
      uri:
        type: string
        title: URI
      uuid:
        type: string
        title: UUID
  partNumber:
    type: string
    title: Part Number
  portDataSetTimestamp:
    type: string
    title: Port Data Set Timestamp
  posID:
    type: string
    title: Position ID
  powerState:
    type: string
    title: Power State
  powerSupply:
    type: string
    title: Power Supply
  productId:
    type: string
    title: Product ID
  productName:
    type: string
    title: Product Name
  protectedMode:
    type: string
    title: Protected Mode
  resetReason:
    type: string
    title: Reset Reason
  savePending:
    type: string
    title: Save Pending
  serialNumber:
    type: string
    title: Serial Number
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: serial_number
    x-samos-correlation:
      correlation-key: core.managed.asset.serial_number
      correlation-type: Machine
      priority: 3
  stackMode:
    type: string
    title: Stack Mode
  stackRole:
    type: string
    title: Stack Role
  sysObjectID:
    type: string
    title: Sys Object ID
  type:
    type: string
    title: Type
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: asset_type
  upTime:
    type: string
    title: Up Time
  userDescription:
    type: string
    title: User Description
  userDefinedName:
    type: string
    title: User Defined Name
  uri:
    type: string
    title: URI
  vpdID:
    type: string
    title: VPD ID
