x-samos-type-name: DellOMEDeviceType
x-samos-namespace: dell.ome
title: Dell OME Device Type
description: Maps Dell OME Type codes to canonical machine asset class values.
x-samos-hidden: true
x-samos-default-hide-from-graph: true
x-samos-global-zone: true

x-samos-extends-types:
  - type-name: EnumAssetClass
    subtype-priority: 1

x-samos-keys:
  - id

required:
  - id

x-samos-table:
  - name: value
  - name: description

x-samos-detail:
  - name: id
  - name: value
  - name: description
  - name: map_to

x-samos-derived-properties:
  name:
    title: Name
    type: string
    syntax: expression
    value: '{value}'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name

properties:
  id:
    title: Type Code
    type: string
    x-samos-immutable: true
    x-samos-fulfills:
      type-name: Enum
      property-name: id

  value:
    title: Device Type
    type: string
    x-samos-fulfills:
      type-name: Enum
      property-name: value

  description:
    title: Description
    type: string
    x-samos-fulfills:
      type-name: core.named-object
      property-name: description

  map_to:
    # Correlates to NoeticEnumMachineAssetClass.id for canonical asset_class resolution.
    title: Map To
    type: string
    x-samos-correlation:
      correlation-key: EnumId
      correlation-type: Enum
      priority: 1
