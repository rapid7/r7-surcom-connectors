id: dnsmadeeasy
name: DNS Made Easy
author: Rapid7
version: 1.1.0
icon: icon.svg
notice: Copyright © 2026 Rapid7. All rights reserved.

current_changes:
  - Update dependencies

types:
  - DNSMadeEasyDomain
  - DNSMadeEasyARecord
  - DNSMadeEasyAAAARecord
  - DNSMadeEasyCname
  - DNSMadeEasyContact

functions:
  - id: test

  - id: import_all
    title: DNS Made Easy Domains, Contacts and A Records
    description: Import managed domains, contacts, and DNS records (A, AAAA, CNAME) from DNS Made Easy
    return_types:
      - DNSMadeEasyDomain
      - DNSMadeEasyARecord
      - DNSMadeEasyAAAARecord
      - DNSMadeEasyCname
      - DNSMadeEasyContact

# Settings that will be used to configure this Connector.
settings:
  url:
    type: string
    title: URL
    description: URL for DNS Made Easy
    default: https://api.dnsmadeeasy.com

  api_key:
    type: string
    title: API Key
    description: API Key for DNS Made Easy

  secret_key:
    type: string
    title: Secret Key
    description: Secret Key for DNS Made Easy
    format: password

runtime: py311

categories:
  - external_attack_surface
