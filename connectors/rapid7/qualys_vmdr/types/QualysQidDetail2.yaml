x-samos-type-name: QualysQidDetail2
x-samos-namespace: qualys
title: Qualys QID Detail
description: Qualys Vulnerability details.

x-samos-extends-types:
  - type-name: Exposure
    subtype-priority: 4

x-samos-global-zone: true

x-samos-keys:
  - QID

required:
  - QID

x-samos-table:
  - name: QID
  - name: TITLE
  - name: SEVERITY_LEVEL
  - name: cvssScore
  - name: VULN_TYPE
  - name: PATCHABLE
  - name: PCI_FLAG

x-samos-detail:
  - name: QID
  - name: TITLE
  - name: SEVERITY_LEVEL
  - name: cvssScore
  - name: VULN_TYPE
  - name: CATEGORY
  - name: PATCHABLE
  - name: PCI_FLAG
  - name: PUBLISHED_DATETIME
  - name: PATCH_PUBLISHED_DATE
  - name: LAST_SERVICE_MODIFICATION_DATETIME
  - name: DIAGNOSIS
  - name: CONSEQUENCE
  - name: SOLUTION
  - name: SOLUTION_COMMENT
  - name: d_cves
  - name: BUGTRAQ_LIST
  - name: VENDOR_REFERENCE_LIST
  - name: SOFTWARE_LIST
  - name: THREAT_INTELLIGENCE
  - name: DISCOVERY

x-samos-derived-properties:
  cvssScore:
    title: CVSS Score
    type: number
    syntax: jmespath
    value: to_number(not_null(CVSS_V3.TEMPORAL, CVSS_V3.BASE, CVSS.TEMPORAL, CVSS.BASE, sum([to_number(SEVERITY_LEVEL), to_number(SEVERITY_LEVEL)])))

  d_exposure_type:
    # NOTE: findings have "type" (Vuln/Practice/Ig) - that is not currently available on the QID
    # So: mark as "Vulnerability" if there are any CVEs, otherwise "Misconfiguration"
    x-samos-hidden: true
    syntax: jmespath
    value: >-
      CVE_LIST.CVE[*].ID && `ExposureType: Vulnerability` || `ExposureType: Configuration`
    type: string
    x-samos-fulfills:
      type-name: Exposure
      property-name: exposure_type
    x-samos-ref-types:
      - type-name: NoeticEnumExposureType
        key-name: id

  d_cves:
    title: CVEs
    type: array
    items:
      type: string
      x-samos-ref-types:
        - type-name: Vulnerability
          key-name: id
    syntax: jmespath
    value: 'CVE_LIST.CVE[*].ID'
    x-samos-fulfills:
      type-name: Exposure
      property-name: vulnerabilities

properties:
  QID:
    type: string
    description: The Qualys ID (QID) assigned to the vulnerability.
    title: Qualys Vulnerability ID
    x-samos-immutable: true
    x-samos-fulfills:
      type-name: Exposure
      property-name: id
  TITLE:
    type: string
    title: Vulnerability Title
    description: The title of the vulnerability.
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name
  SEVERITY_LEVEL:
    type: string
    title: Vulnerability Severity
    description: The severity level assigned to the vulnerability.
    x-samos-ref-types:
      - type-name: QualysEnumSeverity
        key-name: id
    x-samos-fulfills:
      type-name: Exposure
      property-name: severity
  CATEGORY:
    type: string
    title: Vulnerability Category
    description: The category of the vulnerability.
  CUSTOMIZED:
    type: object
    title: Customized
    description: Customization done by Manager users.
    properties:
      DISABLED:
        type: string
        title: Vulnerability Disabled
        description: Identifies whether the vulnerability was disabled by a Manager users. If disabled, the vulnerabilities is filtered from reports.
      CUSTOM_SEVERITY:
        type: string
        title: Custom Severity
        description: Identifies whether the severity level was changed. Managers can change the severity level by editing the vulnerability in the Qualys KnowledgeBase.
  DIAGNOSIS:
    type: string
    title: Diagnosis
    description: The Qualys provided description of the threat/diagnosis.
    x-samos-fulfills:
      type-name: core.named-object
      property-name: description
  CONSEQUENCE:
    type: string
    title: Consequence
    description: The Qualys provided description of the consequence/impact.
  SOLUTION:
    type: string
    title: Solution Description
    description: The Qualys provided description of the solution.
    x-samos-fulfills:
      type-name: Exposure
      property-name: solution
  SOLUTION_COMMENT:
    type: string
    title: Solution Comment
    description: User-defined description of the solution.
  COMPLIANCE:
    title: Compliance
    description: Compliance policy or regulation.
    type: object
    properties:
      COMPLIANCE_INFO:
        type: array
        title: Compliance Info List
        description: Compliance info list.
        items:
          properties:
            COMPLIANCE_TYPE:
              type: string
              title: Compliance Type
              description: The type of a compliance policy or regulation that is associated with the vulnerability.
              example: HIPAA, GLBA, CobIT , SOX
            COMPLIANCE_SECTION:
              type: string
              title: Compliance Section
              description: The section of a compliance policy or regulation associated with the vulnerability.
            COMPLIANCE_DESCRIPTION:
              type: string
              title: Compliance Description
              description: The description of a compliance policy or regulation associated with the vulnerability.
  CORRELATION:
    type: object
    title: Correlation
    properties:
      EXPLOITABILITY:
        type: object
        description: Exploitability information for the vulnerability from third party vendors and/or publicly available sources.
        properties:
          EXPLT_SRC:
            type: array
            title: Vulnerability Source Info
            description: vulnerability source info.
            items:
              properties:
                SRC_NAME:
                  type: string
                  title: Vulnerability Source Name
                  description: The name of a third party vendor or publicly available source of the vulnerability information.
                EXPLT_LIST:
                  type: object
                  title: Exploitability List
                  description: List of Exploitability.
                  properties:
                    EXPLT:
                      type: array
                      title: Exploitability
                      description: Exploitability.
                      items:
                        properties:
                          REF:
                            type: string
                            title: Exploitability CVE Reference
                            description: The CVE reference for the exploitability information.
                          DESC:
                            type: string
                            title: Description
                            description: The description provided by the source of the exploitability information.
                          LINK:
                            type: string
                            title: Link to Exploit
                            description: A link to the exploit, when available.
      MALWARE:
        type: object
        title: Malware Information
        description: Malware information for the vulnerability from Trend Micro.
        properties:
          MW_SRC:
            title: Malware Source List
            description: List of malware sources.
            type: array
            items:
              properties:
                SRC_NAME:
                  type: string
                  title: Source of Malware Info
                  description: The name of the source of the malware information,Trend Micro.
                MW_LIST:
                  type: object
                  title: List of Malware Info
                  description: List of malware info
                  properties:
                    MW_INFO:
                      type: array
                      title: Malware Info
                      description: List of malware info.
                      items:
                        properties:
                          MW_ID:
                            type: string
                            title: Malware ID
                            description: The malware name/ID assigned by Trend Micro.
                          MW_TYPE:
                            type: string
                            title: Malware Type
                            description: The type of malware.
                            example: Backdoor, Virus, Worm , Trojan
                          MW_PLATFORM:
                            type: string
                            title: Malware Affected Platforms
                            description: A list of the platforms that may be affected by the malware.
                          MW_ALIAS:
                            type: string
                            title: Malware ALIAS
                            description: A list of other names used by different vendors and/or publicly available sources to refer to the same threat.
                          MW_RATING:
                            type: string
                            title: Malware Rating
                            description: The overall risk rating as determined by Trend Micro.
                            example: Low, Medium,High
                          MW_LINK:
                            type: string
                            title: Malware Link
                            description: A link to malware details.
  PCI_FLAG:
    type: string
    title: PCI Flag
    description: A flag that indicates whether the vulnerability must be fixed to pass a PCI compliance scan.
  LAST_SERVICE_MODIFICATION_DATETIME:
    type: string
    format: date-time
    title: Last Service Modification
    description: The date and time when the vulnerability was last updated in the Qualys KnowledgeBase.
  CVSS:
    type: object
    title: CVSS Score
    description: CVSS v2 scoring information.
    properties:
      BASE:
        type: string
        title: CVSS2 Base Score
        description: CVSS2 base score defined for the vulnerability.
      TEMPORAL:
        type: string
        title: CVSS2 Temporal Score
        description: CVSS2 temporal score defined for the vulnerability.
      VECTOR_STRING:
        type: string
        title: CVSS2 Vector String
        description: CVSS2 vector string.
  CVSS_V3:
    type: object
    title: CVSS3 Score
    description: CVSS v3 scoring information.
    properties:
      BASE:
        type: string
        title: CVSS3 Base Score
        description: CVSS3 base score defined for the vulnerability.
      TEMPORAL:
        type: string
        title: CVSS3 Temporal Score
        description: CVSS3 temporal score defined for the vulnerability.
      VECTOR_STRING:
        type: string
        title: CVSS3 Vector String
        description: CVSS3 vector string.
      CVSS3_VERSION:
        type: string
        title: CVSS3 Version
        description: CVSS3 version that is currently supported.
  VENDOR_REFERENCE_LIST:
    type: object
    title: Vendor Reference List
    description: List of vendor reference info's.
    properties:
      VENDOR_REFERENCE:
        type: array
        title: Vendor Reference Info
        description: The name of a vendor reference, and the URL to this vendor reference
        items:
          properties:
            ID:
              type: string
              title: Vendor Reference Name
              description: The name of a vendor reference, CVE name, or Bugtraq ID.
            URL:
              type: string
              title: Vendor Reference URL
              description: The URL to the vendor reference, CVE name, or Bugtraq ID.
  CVE_LIST:
    type: object
    title: CVE List
    description: List of CVE info.
    properties:
      CVE:
        type: array
        title: CVE Info
        description: List of CVE info.
        items:
          properties:
            ID:
              type: string
              title: CVE Name
              description: A CVE name assigned to the vulnerability.
            URL:
              type: string
              title: CVE URL
              description: The URL to this CVE name assigned to the vulnerability.
  BUGTRAQ_LIST:
    type: object
    title: Bugtraq List
    description: List of Bugtraq info.
    properties:
      BUGTRAQ:
        type: array
        title: Bugtraq Info
        description: Bugtraq info.
        items:
          properties:
            ID:
              type: string
              title: Bugtraq ID
              description: A Bugtraq ID assigned to the vulnerability.
            URL:
              type: string
              title: Bugtraq URL
              description: The URL to this Bugtraq ID assigned to the vulnerability.
  VULN_TYPE:
    type: string
    title: Vulnerability Type
    description: The type of vulnerability (e.g. Vulnerability, Practice, Information Gathered).
  PUBLISHED_DATETIME:
    type: string
    format: date-time
    title: Published Date
    description: The date and time the vulnerability was published in the Qualys KnowledgeBase.
  CODE_MODIFIED_DATETIME:
    type: string
    format: date-time
    title: Code Modified Date
    description: The date and time the detection code was last modified.
  PATCHABLE:
    type: boolean
    title: Patchable?
    description: Whether a patch is available for the vulnerability.
  PATCH_PUBLISHED_DATE:
    type: string
    format: date-time
    title: Patch Published Date
    description: The date and time the patch was published.
  SOFTWARE_LIST:
    type: object
    title: Software List
    description: Software affected by the vulnerability.
    properties:
      SOFTWARE:
        type: array
        title: Software
        description: Affected software information.
        items:
          title: Software
          type: object
          properties:
            PRODUCT:
              type: string
              title: Product
              description: The affected software product name.
            VENDOR:
              type: string
              title: Vendor
              description: The vendor of the affected software.
  THREAT_INTELLIGENCE:
    type: object
    title: Threat Intelligence
    description: Threat intelligence information associated with the vulnerability.
    properties:
      THREAT_INTEL:
        type: array
        title: Threat Intel
        description: List of threat intelligence indicators.
        items:
          properties:
            id:
              type: string
              title: Threat Intel ID
              description: The threat intelligence indicator ID.
            text:
              type: string
              title: Threat Intel Text
              description: The threat intelligence indicator description.
  DISCOVERY:
    type: object
    title: Discovery
    description: Discovery information for the vulnerability detection method.
    properties:
      REMOTE:
        type: string
        title: Remote Discovery?
        description: Whether the vulnerability can be discovered remotely (1) or requires local/authenticated access (0).
      AUTH_TYPE_LIST:
        type: object
        title: Authentication Type List
        description: Authentication types used for detection.
        properties:
          AUTH_TYPE:
            title: Authentication Type List
            type: array
            items:
              type: string
              title: Authentication Type
              description: The authentication type used for detection (e.g. SSH, SNMP, WMI).
      ADDITIONAL_INFO:
        type: string
        title: Additional Info
        description: Additional information about the vulnerability detection.
