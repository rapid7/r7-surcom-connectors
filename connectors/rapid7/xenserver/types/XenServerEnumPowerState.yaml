x-samos-type-name: XenServerEnumPowerState
x-samos-namespace: xenserver
title: XenServer Power State
description: Power state values of XenServer VMs (vm_power_state), mapped to the standard operational status.

x-samos-extends-types:
  - type-name: EnumOperationalStatus
    subtype-priority: 1

x-samos-keys:
  - id

required:
  - id

x-samos-global-zone: true
x-samos-default-hide-from-graph: true
x-samos-hidden: true

x-samos-table:
  - name: value
  - name: description

x-samos-detail:
  - name: value
  - name: description
  - name: id
  - name: map_to

x-samos-derived-properties:
  # Enum values need a name for display; the power state itself is the name. value already fills
  # Enum.value, and a property can only fill one target, so the name is a copy of it.
  d_name:
    title: Name
    type: string
    x-samos-hidden: true
    syntax: expression
    value: '{value}'
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name

properties:
  id:
    type: string
    title: Id
    x-samos-hidden: true
    x-samos-immutable: true
    x-samos-fulfills:
      type-name: Enum
      property-name: id
  value:
    type: string
    title: Value
    x-samos-fulfills:
      type-name: Enum
      property-name: value
  map_to:
    type: string
    title: Map To Id
    x-samos-correlation:
      priority: 1
      correlation-key: EnumId
      correlation-type: Enum
  description:
    type: string
    title: Description
    x-samos-fulfills:
      type-name: core.named-object
      property-name: description
