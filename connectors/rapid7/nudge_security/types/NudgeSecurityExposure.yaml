x-samos-type-name: NudgeSecurityExposure
x-samos-namespace: nudge.security
title: Nudge Security Exposure
description: A general security rule or policy defined by Nudge Security that describes a class of risk or misconfiguration.
x-samos-detail-prefer-type-title: true

x-samos-extends-types:
  - type-name: Exposure
    subtype-priority: 3

x-samos-global-zone: true

x-samos-keys:
  - d_id

x-samos-table:
  - name: name
  - name: risk_category
  - name: severity
  - name: resource_type

x-samos-detail:
  - name: name
  - name: description
  - name: resource_type
  - name: risk_category
  - name: severity

x-samos-derived-properties:
  d_id:
    # The "id" property is an integer; derive a string to fulfill Exposure.id.
    type: string
    syntax: jmespath
    value: 'id'
    x-samos-hidden: true
    x-samos-immutable: true
    x-samos-fulfills:
      type-name: Exposure
      property-name: id

  d_exposure_type:
    x-samos-hidden: true
    type: string
    syntax: expression
    value: 'ExposureType: Configuration'
    x-samos-ref-types:
      - type-name: NoeticEnumExposureType
        key-name: id
    x-samos-fulfills:
      type-name: Exposure
      property-name: exposure_type

