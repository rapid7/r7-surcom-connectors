x-samos-derived-properties:
  d_full_name:
    title: Full Name
    type: string
    syntax: jmespath
    value: "employee_name || join(' ', [firstname, middlename, lastname][?@])"
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name

  d_active:
    title: Active
    type: boolean
    syntax: jmespath
    value: "employee_status == 'A'"
    x-samos-fulfills:
      type-name: core.principal
      property-name: active

  d_employee_id:
    title: Employee ID
    type: string
    syntax: jmespath
    value: 'employee_code'
    x-samos-fulfills:
      type-name: User
      property-name: employee_id

