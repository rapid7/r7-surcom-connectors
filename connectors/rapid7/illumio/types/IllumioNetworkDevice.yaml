x-samos-type-name: IllumioNetworkDevice
x-samos-namespace: illumio
title: Illumio Network Device
description: A network device managed by the Illumio PCE for switch-based enforcement via Network Enforcement Nodes (NEN).
x-samos-detail-prefer-type-title: true

x-samos-extends-types:
  - type-name: Machine
    subtype-priority: 3

x-samos-keys:
  - id

x-samos-derived-properties:
  # Map `status == active` onto core.component / active boolean
  d_active:
    title: Active?
    type: boolean
    syntax: jmespath
    value: 'status == `active`'
    x-samos-fulfills:
      type-name: core.component
      property-name: active

x-samos-table:
  - name: config.name
  - name: config.device_type
  - name: config.manufacturer
  - name: config.model
  - name: d_active
  - name: configure

x-samos-detail:
  - name: config.name
  - name: config.description
  - name: config.device_type
  - name: config.manufacturer
  - name: config.model
  - name: config.ip_address
  - name: d_active
  - name: configure
  - name: supported_endpoint_type
  - name: enforcement_instructions_generation_in_progress
  - name: enforcement_instructions_data_timestamp
  - name: enforcement_instructions_ack_timestamp
  - name: endpoints
  - name: network_enforcement_node

properties:
  id:
    title: Object ID
    x-samos-immutable: true
    x-samos-hidden: true
    type: string
    x-samos-fulfills:
      type-name: core.component
      property-name: id

  href:
    title: Href
    type: string
    x-samos-hidden: true

  config:
    title: Configuration
    type: object
    properties:
      name:
        title: Device Name
        type: string
        x-samos-fulfills:
          type-name: core.named-object
          property-name: name
      description:
        title: Description
        type: string
        x-samos-fulfills:
          type-name: core.named-object
          property-name: description
      device_type:
        title: Device Type
        type: string
        x-samos-fulfills:
          type-name: core.managed.asset
          property-name: asset_type
      manufacturer:
        title: Manufacturer
        type: string
        x-samos-fulfills:
          type-name: core.managed.asset
          property-name: make
      model:
        title: Model
        type: string
        x-samos-fulfills:
          type-name: core.managed.asset
          property-name: model
      ip_address:
        title: IP Address
        type: string
        format: ip-addr
        x-samos-fulfills:
          type-name: Machine
          property-name: ips

  configure:
    title: Configure?
    type: boolean

  enforcement_instructions_generation_in_progress:
    title: Enforcement Instructions Generation In Progress?
    type: boolean

  enforcement_instructions_data_href:
    title: Enforcement Instructions Data Href
    type: string
    x-samos-hidden: true

  enforcement_instructions_data_timestamp:
    title: Enforcement Instructions Data Timestamp
    type: string
    format: date-time

  enforcement_instructions_ack_href:
    title: Enforcement Instructions Ack Href
    type: string
    x-samos-hidden: true

  enforcement_instructions_ack_timestamp:
    title: Enforcement Instructions Ack Timestamp
    type: string
    format: date-time
  supported_endpoint_type:
    title: Supported Endpoint Type
    type: string
  endpoints:
    title: Endpoints
    type: array
    items:
      type: object
      properties:
        href:
          title: Endpoint Href
          type: string
  network_enforcement_node:
    title: Network Enforcement Node
    type: object
    properties:
      href:
        title: NEN Href
        type: string
  status:
    title: Status
    type: string
