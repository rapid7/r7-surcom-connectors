x-samos-derived-properties:
  # Map `online` boolean onto core.component / active
  d_active:
    x-samos-hidden: true
    title: Active?
    type: boolean
    syntax: jmespath
    value: 'online == `true`'
    x-samos-fulfills:
      type-name: core.component
      property-name: active

  # Merge `interfaces[].address` and top-level `public_ip` into one IP list
  d_ips:
    x-samos-hidden: true
    title: IPs
    type: array
    syntax: jmespath
    value: '[interfaces[].address, [public_ip]][] | [?@ != null]'
    items:
      type: string
      format: ip-addr
    x-samos-fulfills:
      type-name: Machine
      property-name: ips

  # Hostname containing a dot — used for qualified hostname correlation
  d_qualified_hostname:
    x-samos-hidden: true
    type: string
    syntax: jmespath
    value: 'hostname && contains(hostname, `.`) && hostname || null'
    x-samos-correlation:
      correlation-key: Machine.qualified-hostname
      correlation-type: Machine
      priority: 2

  # Hostname without a dot — used for unqualified hostname correlation
  d_unqualified_hostname:
    x-samos-hidden: true
    type: string
    syntax: jmespath
    value: 'hostname && !contains(hostname, `.`) && hostname || null'
    x-samos-correlation:
      correlation-key: Machine.unqualified-hostname
      correlation-type: Machine
      priority: 2

  # Flatten `labels[]` to label hrefs referencing IllumioLabel records
  d_source_tags:
    x-samos-hidden: true
    title: Source Tags
    type: array
    syntax: jmespath
    value: 'labels[].href'
    items:
      type: string
      x-samos-ref-types:
        - type-name: IllumioLabel
          key-name: id
    x-samos-fulfills:
      type-name: core.component
      property-name: source_tags

  # Flatten MAC addresses from `interfaces[]` into a single list
  d_mac_addresses:
    x-samos-hidden: true
    title: MAC Addresses
    type: array
    syntax: jmespath
    value: 'interfaces[].mac_address'
    items:
      type: string
      format: mac-addr
    x-samos-fulfills:
      type-name: Machine
      property-name: mac_addresses
    x-samos-correlation:
      correlation-key: MacAddr.value
      correlation-type: Machine
      priority: 4

