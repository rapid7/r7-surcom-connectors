x-samos-type-name: PaloAltoPanoramaServer
x-samos-namespace: palo.alto.panorama

title: Palo Alto Panorama
description: A Palo Alto Networks Panorama management server (virtual or M-Series appliance) that manages PAN-OS firewalls
x-samos-detail-prefer-type-title: true

x-samos-extends-types:
  - type-name: Machine
    subtype-priority: 5

x-samos-keys:
  - x_id

required:
  - x_id

x-samos-table:
  - name: hostname
  - name: ip-address
  - name: model
  - name: sw-version
  - name: system-mode
  - name: x_id
    label: Serial Number / VM UUID

x-samos-detail:
  - name: hostname
  - name: devicename
  - name: ip-address
  - name: ipv6-address
  - name: public-ip-address
  - name: mac-address
  - name: model
  - name: family
  - name: serial
  - name: sw-version
  - name: system-mode
  - name: operational-mode
  - name: licensed-device-capacity
  - name: num-cpus
  - name: ram-in-gb
  - name: vm-mode
  - name: app-version
  - name: av-version
  - name: wildfire-version
  - name: device-certificate-status
  - name: plugin_versions
  - name: uptime

x-samos-derived-properties:
  # Combines the management IPv4, IPv6 and public addresses into the single list Machine:ips needs ("unknown" is dropped)
  d_ips:
    type: array
    items:
      type: string
      format: ip-addr
    syntax: jmespath
    value: '["ip-address", "ipv6-address", "public-ip-address"][?@ && @ != ''unknown'']'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: Machine
      property-name: ips

  # "devicename" can be empty, so fall back to the hostname, then the ID
  d_name:
    type: string
    syntax: jmespath
    value: 'devicename || hostname || x_id'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name

  # Panorama VMs without a license report serial "unknown", which must not be used for correlation
  d_serial_number:
    type: string
    syntax: jmespath
    value: "serial != 'unknown' && serial || null"
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: serial_number
    x-samos-correlation:
      correlation-key: core.managed.asset.serial_number
      correlation-type: Machine
      priority: 3

  # A Panorama that keeps its default hostname (the model, "Panorama") must not correlate on it
  d_qualified_hostname:
    type: string
    syntax: jmespath
    value: "hostname && contains(hostname, '.') && hostname != model && hostname || null"
    x-samos-hidden: true
    x-samos-correlation:
      correlation-key: Machine.qualified-hostname
      correlation-type: Machine
      priority: 3

  # Counterpart of d_qualified_hostname for hostnames without a domain part
  d_unqualified_hostname:
    type: string
    syntax: jmespath
    value: "hostname && !contains(hostname, '.') && hostname != model && hostname || null"
    x-samos-hidden: true
    x-samos-correlation:
      correlation-key: Machine.unqualified-hostname
      correlation-type: Machine
      priority: 3

  # Constant: every device imported by this connector is made by Palo Alto Networks
  d_make:
    type: string
    syntax: expression
    value: 'Palo Alto Networks'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: make

  # Constant: Panorama is a firewall management server, not a firewall
  d_asset_type:
    type: string
    syntax: expression
    value: 'Firewall Management Server'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: asset_type

  # Constant: Panorama is a server appliance (VM or M-Series)
  d_asset_class:
    type: string
    syntax: expression
    value: 'MachineAssetClass: Server'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: asset_class
    x-samos-ref-types:
      - key-name: id
        type-name: NoeticEnumMachineAssetClass

  # Constant: Panorama runs PAN-OS
  d_os_product:
    type: string
    syntax: expression
    value: 'PAN-OS'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: Machine
      property-name: os_product

  # Constant enum reference for the OS family, so Panorama groups with other PAN-OS devices
  d_os_family:
    type: string
    syntax: jmespath
    value: '`OSFamily: PAN-OS`'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: Machine
      property-name: os_family
    x-samos-ref-types:
      - key-name: id
        type-name: NoeticEnumOSFamily

  # Display name of the operating system, "PAN-OS <version>" (e.g. "PAN-OS 12.2.2")
  d_operating_system:
    type: string
    syntax: jmespath
    value: 'join('' '', [''PAN-OS'', "sw-version"][?@])'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: Machine
      property-name: operating_system

  # Virtual Panorama reports model "Panorama"; M-Series appliances report e.g. "M-200"
  d_virtual:
    type: boolean
    syntax: jmespath
    value: "model == 'Panorama'"
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.component
      property-name: virtual

properties:
  x_id:
    type: string
    title: ID
    description: Serial number, or the VM UUID when the serial number is unknown
    x-samos-immutable: true
    x-samos-fulfills:
      type-name: core.component
      property-name: id
  hostname:
    type: string
    title: Hostname
    x-samos-fulfills:
      type-name: Machine
      property-name: hostnames
  devicename:
    type: string
    title: Device Name
  ip-address:
    type: string
    title: Management IP Address
  netmask:
    type: string
    title: Management Netmask
  default-gateway:
    type: string
    title: Management Default Gateway
  public-ip-address:
    type: string
    title: Public IP Address
  ipv6-address:
    type: string
    title: Management IPv6 Address
  ipv6-link-local-address:
    type: string
    title: Management IPv6 Link Local Address
  mac-address:
    type: string
    format: mac-addr
    title: Management MAC Address
    x-samos-fulfills:
      type-name: Machine
      property-name: mac_addresses
    x-samos-correlation:
      correlation-key: MacAddr.value
      correlation-type: Machine
      priority: 4
  uptime:
    type: string
    title: Uptime
  family:
    type: string
    title: Family
  platform-family:
    type: string
    title: Platform Family
  model:
    type: string
    title: Model
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: model
  serial:
    type: string
    title: Serial Number
  sw-version:
    type: string
    title: PAN-OS Version
    x-samos-fulfills:
      type-name: Machine
      property-name: os_version
  system-mode:
    type: string
    title: System Mode
    description: panorama, management-only or logger
  operational-mode:
    type: string
    title: Operational Mode
  device-certificate-status:
    type: string
    title: Device Certificate Status
  vm-uuid:
    type: string
    title: VM UUID
    x-samos-correlation:
      correlation-key: Machine.hardware-id
      correlation-type: Machine
      priority: 3
  vm-mode:
    type: string
    title: VM Mode
  cloud-mode:
    type: string
    title: Cloud Mode
  licensed-device-capacity:
    type: string
    title: Licensed Device Capacity
    description: Number of firewalls the Panorama license can manage
  num-cpus:
    type: string
    title: CPUs
  ram-in-gb:
    type: string
    title: Memory (GB)
  panlogs-partition-in-gb:
    type: string
    title: Log Partition Size (GB)
  app-version:
    type: string
    title: Application Version
  app-release-date:
    type: string
    title: Application Release Date
  av-version:
    type: string
    title: Antivirus Version
  wildfire-version:
    type: string
    title: WildFire Version
  wildfire-rt:
    type: string
    title: WildFire Real-Time
  wf-private-version:
    type: string
    title: WildFire Private Version
  wf-private-release-date:
    type: string
    title: WildFire Private Release Date
  device-dictionary-version:
    type: string
    title: Device Dictionary Version
  device-dictionary-release-date:
    type: string
    title: Device Dictionary Release Date
  url-db:
    type: string
    title: URL Database
  logdb-version:
    type: string
    title: Log Database Version
  # "entry" is a list, or a single object when only one plugin is installed (XML conversion)
  plugin_versions:
    type: object
    title: Plugin Versions
