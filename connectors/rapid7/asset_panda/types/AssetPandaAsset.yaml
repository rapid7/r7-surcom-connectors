x-samos-type-name: AssetPandaAsset
x-samos-namespace: asset.panda
title: Asset Panda Asset
description: A physical or digital IT asset from a configured Asset Panda collection,
  sourced from POST /collection-records/search.
x-samos-detail-prefer-type-title: true

x-samos-extends-types:
  - type-name: Machine
    subtype-priority: 4

x-samos-keys:
  - id

required:
  - id

x-samos-table:
  - name: hostname
  - name: asset_type
  - name: d_users
  - name: location
  - name: ip_addresses
  - name: serial_number
  - name: lastupdated

x-samos-detail:
  - name: accountid
  - name: moduleid
  - name: hostname
  - name: d_users
  - name: ip_addresses
  - name: mac_addresses
  - name: serial_number
  - name: collectiontype
  - name: dateadded
  - name: lastupdated
  - name: addedby
  - name: lastupdatedby
  - name: locked
  - name: asset_type
  - name: location
  - name: make
  - name: model
  - name: operating_system
  - name: customFields

x-samos-derived-properties:
  d_name:
    title: Name
    # Maps hostname to the unified display name (core.named-object.name);
    # hostname already feeds Machine.hostnames so a derived prop is required.
    # Falls back to Asset Tag, then serial number, for assets without a hostname.
    type: string
    syntax: jmespath
    value: 'hostname || customFields."Asset Tag" || serial_number'
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name

  d_users:
    title: Assigned To
    # Surfaces the assigned person as the unified Machine "Business User"
    # (core.owned-entity.users) so Machine -> User ownership queries resolve.
    type: array
    items:
      type: string
      x-samos-ref-types:
        - type-name: AssetPandaPerson
          key-name: id
    syntax: jmespath
    value: 'assigned_to && [assigned_to]'
    x-samos-fulfills:
      type-name: core.owned-entity
      property-name: users

  d_qualified_hostname:
    x-samos-hidden: true
    type: string
    syntax: jmespath
    value: "hostname && contains(hostname, '.') && hostname || null"
    x-samos-correlation:
      correlation-key: Machine.qualified-hostname
      correlation-type: Machine
      priority: 2

  d_unqualified_hostname:
    x-samos-hidden: true
    type: string
    syntax: jmespath
    value: "hostname && !contains(hostname, '.') && hostname || null"
    x-samos-correlation:
      correlation-key: Machine.unqualified-hostname
      correlation-type: Machine
      priority: 2

properties:
  id:
    type: string
    title: ID
    x-samos-immutable: true
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.component
      property-name: id

  accountid:
    type: string
    title: Account
    x-samos-ref-types:
      - type-name: AssetPandaAccount
        key-name: id

  moduleid:
    type: string
    title: Module
    x-samos-ref-types:
      - type-name: AssetPandaModule
        key-name: id

  orgid:
    type: string
    title: Org ID

  collectionid:
    type: string
    title: Collection ID

  collectiontype:
    type: string
    title: Collection Type

  dateadded:
    type: string
    title: Date Added
    format: date-time
    x-samos-fulfills:
      type-name: core.component
      property-name: first_seen

  lastupdated:
    type: string
    title: Last Updated
    format: date-time
    x-samos-fulfills:
      type-name: core.component
      property-name: last_seen

  addedby:
    type: string
    title: Added By

  lastupdatedby:
    type: string
    title: Last Updated By

  locked:
    type: string
    title: Locked

  typeprimary:
    type: string
    title: Type Primary
    x-samos-hidden: true

  system_id_numericautoincrement:
    type: object
    title: System ID
    x-samos-hidden: true
    properties:
      incrValue:
        type: integer
        title: Increment Value
      value:
        type: string
        title: Value

  hostname:
    type: string
    title: Hostname
    x-samos-fulfills:
      type-name: Machine
      property-name: hostnames

  asset_type:
    type: string
    title: Asset Type
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: asset_type

  assigned_to:
    type: string
    title: Assigned To
    x-samos-hidden: true

  location:
    type: string
    title: Location
    x-samos-ref-types:
      - type-name: AssetPandaLocation
        key-name: id
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: location

  ip_addresses:
    type: array
    title: IP Addresses
    items:
      type: string
      format: ip-addr
    x-samos-fulfills:
      type-name: Machine
      property-name: ips

  mac_addresses:
    type: array
    title: MAC Addresses
    items:
      type: string
      format: mac-addr
    x-samos-fulfills:
      type-name: Machine
      property-name: mac_addresses
    x-samos-correlation:
      correlation-key: MacAddr.value
      correlation-type: Machine
      priority: 3

  serial_number:
    type: string
    title: Serial Number
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: serial_number
    x-samos-correlation:
      correlation-key: core.managed.asset.serial_number
      correlation-type: Machine
      priority: 3

  make:
    type: string
    title: Manufacturer
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: make

  model:
    type: string
    title: Model
    x-samos-fulfills:
      type-name: core.managed.asset
      property-name: model

  operating_system:
    type: string
    title: Operating System
    x-samos-fulfills:
      type-name: Machine
      property-name: operating_system

  customFields:
    type: object
    title: Custom Fields
    description: >-
      Custom field values keyed by display name, sourced from /collection-records/search.
      Fields mapped to top-level properties via Settings are not repeated here.
    properties:
      Asset Tag:
        type: string
        title: Asset Tag
        x-samos-fulfills:
          type-name: core.managed.asset
          property-name: asset_tag
      Subnet Mask:
        type: string
        title: Subnet Mask
      DNS Server:
        type: string
        title: DNS Server
      Domain:
        type: string
        title: Domain
    additionalProperties:
      type: string
