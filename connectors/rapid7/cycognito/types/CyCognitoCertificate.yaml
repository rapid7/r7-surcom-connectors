x-samos-type-name: CyCognitoCertificate
x-samos-namespace: cycognito
title: CyCognito Certificate
description: A TLS certificate discovered by CyCognito external attack surface management.

x-samos-extends-types:
  - type-name: Certificate
    subtype-priority: 2

$ref: 'https://api.platform.cycognito.com/v1#/paths/~1v1~1assets/post/responses/200/content/application~1json/schema/items'

x-samos-keys:
  - id

required:
  - id

x-samos-table:
  - name: subject-common-name
  - name: issuer-organization
  - name: public-key-type
  - name: security-grade
  - name: expiration

x-samos-detail:
  - name: subject-common-name
  - name: subject-organization
  - name: subject-alt-names
  - name: issuer-common-name
  - name: issuer-organization
  - name: issues-count
  - name: serial-number
  - name: signature-algorithm
  - name: public-key-type
  - name: public-key-length
  - name: expiration
  - name: security-grade
  - name: security-score
