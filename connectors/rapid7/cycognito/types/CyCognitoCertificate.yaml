  - name: severe-issues
  - name: organizations
  - name: ip-addresses
  - name: domains
  - name: tags
  - name: first-seen
  - name: last-seen

x-samos-derived-properties:
  # Uses the subject common name as the display name
  d_name:
    type: string
    syntax: jmespath
    value: '"subject-common-name"'
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name

  # True if subject common name starts with '*'
  d_is_wildcard:
    type: boolean
    syntax: jmespath
    value: 'starts_with("subject-common-name" || ``, `*`)'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: Certificate
      property-name: is_wildcard

  # True if the issuer and subject common names are the same
  d_is_self_signed:
    type: boolean
    syntax: jmespath
    value: '"issuer-common-name" == "subject-common-name"'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: Certificate
      property-name: is_self_signed
  # CyCognito continuously scans assets for vulnerabilities
  d_mitigations:
    type: array
    items:
      type: string
      properties: {}
      x-samos-ref-types:
        - key-name: id
          type-name: Mitigation
    value: '[`M1016`]'
    syntax: jmespath
    description: 'This asset record is evidence of mitigations: M1016 "Vulnerability Scanning"'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.component
      property-name: mitigations

