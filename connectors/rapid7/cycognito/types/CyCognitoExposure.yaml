x-samos-type-name: CyCognitoExposure
x-samos-namespace: cycognito
title: CyCognito Exposure
description: A security exposure or vulnerability class identified by CyCognito.

x-samos-extends-types:
  - type-name: Exposure
    subtype-priority: 2

$ref: 'https://api.platform.cycognito.com/v1#/paths/~1v1~1issues/post/responses/200/content/application~1json/schema/items'

x-samos-global-zone: true

x-samos-keys:
  - issue-id

required:
  - issue-id

x-samos-table:
  - name: title
  - name: issue-id
  - name: issue-type
  - name: severity
  - name: cve-ids
  - name: remediation-method

x-samos-detail:
  - name: title
  - name: issue-id
  - name: issue-type
  - name: summary
  - name: severity
  - name: severity-score
  - name: base-severity
  - name: enhanced-severity
  - name: enhanced-severity-score
  - name: exploitation-complexity
  - name: exploitation-score
  - name: detection-complexity
  - name: remediation-steps
  - name: remediation-effort
  - name: remediation-method
  - name: potential-threat
  - name: potential-impact
  - name: references
  - name: cve-ids
  - name: compliance-violations
  - name: d_mitre_tactic
  - name: d_mitre_technique
  - name: d_mitre_next_tactic
  - name: d_mitre_next_technique

x-samos-derived-properties:
  # Classifies as Vulnerability if CVEs exist, otherwise Weakness.
  # Not using "issue-type" because CyCognito's issue-type values (e.g.
  # "Vulnerable Software", "Misconfiguration") are free-form strings
  # without a fixed enum in their API — a custom enum mapping would be
  # fragile. CVE presence is objective and matches the AppCheck DAST
  # pattern: CVEs present → Vulnerability, absent → Weakness.
  d_exposure_type:
    type: string
    syntax: jmespath
    value: 'length("cve-ids" || `[]`) == `0` && `ExposureType: Weakness` || `ExposureType: Vulnerability`'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: Exposure
      property-name: exposure_type
    x-samos-ref-types:
      - type-name: NoeticEnumExposureType
        key-name: id
  # Joins the remediation-steps array into a single newline-separated string
  d_solution:
    type: string
    syntax: jmespath
    value: "join('\\n', \"remediation-steps\" || `[]`)"
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: Exposure
      property-name: solution
  # References MitreAttackTactic by d_name_key (enterprise-attack:<shortname>)
  d_mitre_tactic:
    type: string
    title: MITRE ATT&CK Tactic
    syntax: jmespath
    value: 'join(`:`, [`enterprise-attack`, "mitre-attack-technique-title"])'
    x-samos-ref-types:
      - key-name: d_name_key
        type-name: MitreAttackTactic
  # References MitreAttackTechnique by d_name_key (enterprise-attack:<name>)
  d_mitre_technique:
    type: string
    title: MITRE ATT&CK Technique
    syntax: jmespath
    value: 'join(`:`, [`enterprise-attack`, "mitre-attack-technique-subtitle"])'
    x-samos-ref-types:
      - key-name: d_name_key
        type-name: MitreAttackTechnique
  # References MitreAttackTactic for the next technique's tactic
  d_mitre_next_tactic:
    type: string
    title: MITRE ATT&CK Next Tactic
    syntax: jmespath
    value: 'join(`:`, [`enterprise-attack`, "mitre-attack-next-technique-title"])'
    x-samos-ref-types:
      - key-name: d_name_key
        type-name: MitreAttackTactic
  # References MitreAttackTechnique for the next technique
  d_mitre_next_technique:
    type: string
    title: MITRE ATT&CK Next Technique
    syntax: jmespath
    value: 'join(`:`, [`enterprise-attack`, "mitre-attack-next-technique-subtitle"])'
    x-samos-ref-types:
      - key-name: d_name_key
        type-name: MitreAttackTechnique

