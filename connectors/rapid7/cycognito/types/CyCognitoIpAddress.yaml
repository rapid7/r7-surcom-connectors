  - name: last-seen

x-samos-derived-properties:
  # Uses the IP address as the display name
  d_name:
    type: string
    syntax: jmespath
    value: ip
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name

  # All CyCognito assets are internet-facing, so always public
  d_public:
    type: boolean
    syntax: expression
    value: 'true'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.component
      property-name: public
  # CyCognito continuously scans assets for vulnerabilities
  d_mitigations:
    type: array
    items:
      type: string
      properties: {}
      x-samos-ref-types:
        - key-name: id
          type-name: Mitigation
    value: '[`M1016`]'
    syntax: jmespath
    description: 'This asset record is evidence of mitigations: M1016 "Vulnerability Scanning"'
    x-samos-hidden: true
    x-samos-fulfills:
      type-name: core.component
      property-name: mitigations

