x-samos-type-name: CyCognitoIpAddress
x-samos-namespace: cycognito
title: CyCognito IP Address
description: An IP address discovered by CyCognito external attack surface management.

x-samos-extends-types:
  - type-name: IpAddress
    subtype-priority: 2

$ref: 'https://api.platform.cycognito.com/v1#/paths/~1v1~1assets/post/responses/200/content/application~1json/schema/items'

x-samos-global-zone: true

x-samos-keys:
  - id
  - ip

required:
  - id

x-samos-table:
  - name: ip
  - name: hosting-type
  - name: organizations

