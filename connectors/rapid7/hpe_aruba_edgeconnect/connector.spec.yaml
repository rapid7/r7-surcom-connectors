id: hpe.aruba.edgeconnect
name: HPE Aruba EdgeConnect
author: Rapid7
version: 0.2.0
notice: Copyright © 2026 Rapid7. All rights reserved.

# Add one or two entries that describe changes in this version.
# The publishing process maintains prior changelog entries.
current_changes:
  - Update dependencies

# IDs of Surface Command types in this connector.
# Type IDs must be unique across all connectors. Prefix each with a SnakeCased
# version of the connector ID.
types:
  - HpeArubaEdgeconnectAppliance
  - HpeArubaEdgeconnectApplianceGroup
  - HpeArubaEdgeconnectEnumApplianceState
  - HpeArubaEdgeconnectUser

# Functions provided by this connector. Include a `test` function and at least
# one other function that returns one or more types defined in `types`.
functions:
  - id: test

  - id: import_all
    title: EdgeConnect Appliances, Groups and Users
    description: Import Appliances, Appliance Groups and Users from HPE Aruba Networking Orchestrator
    return_types:
      - HpeArubaEdgeconnectAppliance
      - HpeArubaEdgeconnectApplianceGroup
      - HpeArubaEdgeconnectUser

# Configuration settings for this connector.
settings:
  url:
    type: string
    title: Orchestrator URL
    description: Base URL of your HPE Aruba Networking Orchestrator. The /gms/rest API path is optional
    example: https://orchestrator.example.com

  api_key:
    type: string
    title: API Key
    description: An HPE Aruba Networking Orchestrator API key. A key with Read-Only permission is sufficient
    format: password

  verify_tls:
    type: boolean
    title: Verify TLS?
    description: >-
      If enabled, verify the HPE Aruba Networking Orchestrator TLS certificate.
      Disable only for a self-signed or internal CA certificate
    default: true

# Runtime platform for this connector.
runtime: py311

# Categories for this connector in the Extension Library.
categories:
  - network_firewall
  - asset_management

# If true, when installing this connector in Surface Command, Rapid7
# Orchestrator installation instructions will display.
show_orchestrator_ui: true
