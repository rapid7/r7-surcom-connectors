    title: Policy Group ID
    x-samos-immutable: true
    x-samos-hidden: true
    type: string
    x-samos-fulfills:
      type-name: core.component
      property-name: id

  name:
    title: Policy Group Name
    type: string
    x-samos-fulfills:
      type-name: core.named-object
      property-name: name

  description:
    title: Description
    type: string
    nullable: true
    x-samos-fulfills:
      type-name: core.named-object
      property-name: description

  owner:
    title: Owner
    type: string

  isDefault:
    title: Default Group?
    type: boolean

  isManagedByHalcyon:
