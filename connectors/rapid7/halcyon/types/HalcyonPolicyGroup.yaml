x-samos-type-name: HalcyonPolicyGroup
x-samos-namespace: halcyon
title: Halcyon Policy Group
description: >-
  A policy group that defines endpoint protection policy settings for assets
  on the Halcyon anti-ransomware platform.

x-samos-extends-types:
  - type-name: core.component-group
    subtype-priority: 5

x-samos-keys:
  - id

required:
  - id

x-samos-table:
  - name: name
  - name: description
  - name: owner
  - name: isManagedByHalcyon
  - name: tenantId

x-samos-detail:
  - name: name
  - name: description
  - name: owner
  - name: isDefault
  - name: isManagedByHalcyon
  - name: policies
  - name: tenantId

$ref: 'https://api.halcyon.ai#/components/schemas/PolicyGroupResponse'

properties:
