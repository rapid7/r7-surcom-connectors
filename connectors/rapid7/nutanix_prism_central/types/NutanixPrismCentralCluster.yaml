            fqdn:
              title: FQDN
              type: object
              properties:
                value:
                  title: Value
                  type: string
      ntpServerIpList:
        title: NTP Servers
        type: array
        items:
          type: object
          properties:
            fqdn:
              title: FQDN
              type: object
              properties:
                value:
                  title: Value
                  type: string
      nfsSubnetWhitelist:
        title: NFS Subnet Whitelist
        type: array
        items:
          type: string
      smtpServer:
        title: SMTP Server
        type: object
        additionalProperties: true
      masqueradingIp:
        title: Masquerading IP
        type: object
        additionalProperties: true
      masqueradingPort:
        title: Masquerading Port
        type: integer
      managementServer:
        title: Management Server
        type: object
        additionalProperties: true
